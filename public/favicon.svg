<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    /* Raw Swiss Neo-Brutalist Mechanical Animation */
    @keyframes clashPulse {
      0%, 100% {
        fill: #00F5D4;
      }
      45% {
        fill: #00F5D4;
      }
      50% {
        fill: #FFFFFF;
      }
      55% {
        fill: #00F5D4;
      }
    }

    @keyframes dBreath {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(1px, 1px);
      }
    }

    @keyframes aBreath {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-1px, -1px);
      }
    }

    @keyframes slashGlitch {
      0%, 92%, 100% {
        transform: translate(0, 0);
      }
      94% {
        transform: translate(1px, -1px);
      }
      96% {
        transform: translate(-1px, 1px);
      }
      98% {
        transform: translate(0, 0);
      }
    }

    #clash-body {
      animation: clashPulse 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    #letter-d {
      animation: dBreath 3.5s ease-in-out infinite;
    }

    #letter-a {
      animation: aBreath 3.5s ease-in-out infinite;
    }

    #clash-slash {
      animation: slashGlitch 5s ease infinite;
    }
  </style>

  <!-- 1. Arena Frame -->
  <g id="arena-frame">
    <!-- Solid #000000 Hard Shadow -->
    <rect x="14" y="14" width="78" height="78" fill="#000000" />
    <!-- Sharp Canvas Base -->
    <rect x="8" y="8" width="78" height="78" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
  </g>

  <!-- 2. Letter 'D' (Top-Left Geometric Brutalist 'D') -->
  <g id="letter-d">
    <!-- Hard Drop Shadow -->
    <path d="M 16 18 L 36 18 L 46 28 L 46 48 L 36 58 L 16 58 Z" fill="#000000" transform="translate(4, 4)" />
    <!-- Body -->
    <path d="M 16 18 L 36 18 L 46 28 L 46 48 L 36 58 L 16 58 Z" fill="#FFDE00" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
    <!-- Counter Cutout -->
    <rect x="25" y="28" width="10" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
  </g>

  <!-- 3. Letter 'A' (Bottom-Right Geometric Brutalist 'A') -->
  <g id="letter-a">
    <!-- Hard Drop Shadow -->
    <path d="M 56 36 L 68 36 L 78 76 L 46 76 Z" fill="#000000" transform="translate(4, 4)" />
    <!-- Body -->
    <path d="M 56 36 L 68 36 L 78 76 L 46 76 Z" fill="#FF3366" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
    <!-- Counter Cutout -->
    <rect x="58" y="48" width="8" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
    <!-- Crossbar -->
    <line x1="50" y1="65" x2="74" y2="65" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
  </g>

  <!-- 4. Clash Slash (Diagonal Mint Green Divider) -->
  <g id="clash-slash">
    <!-- Hard Drop Shadow -->
    <polygon points="62,14 70,14 32,80 24,80" fill="#000000" transform="translate(3, 3)" />
    <!-- Body -->
    <polygon id="clash-body" points="62,14 70,14 32,80 24,80" fill="#00F5D4" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
  </g>
</svg>
